# Trajectory-encoder training config -- CloseDrawer
domain: close_drawer
state_dim: 22
action_dim: 8
horizon: 87

data:
  dir: data/close_drawer
  training: training.npz

encoder:
  type: full
  latent_dim: 2
  hidden_dim: 128
  num_layers: 4
  num_heads: 4

train:
  batch_size: 32
  num_epochs: 5000
  lr: 1.0e-4
  recon_weight: 1.0
  kl_weight: 0.001
  dtw_weight: 1.0
  dtw_gamma: 1.0e-5
  geometry: full   # raw EE path (single-stage task)
  save_freq: 500
  device: cuda:0
  save_dir: results/close_drawer/encoder
