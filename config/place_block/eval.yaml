# Adaptation / evaluation config -- PlaceBlock
domain: place_block
state_dim: 22
action_dim: 8
horizon: 64

data:
  dir: data/place_block

encoder_checkpoint: results/place_block/encoder/best_model.pt
policy_checkpoint: results/place_block/pdp/best_model.pt

adapt:
  demo: shiftdemo1          # one of: shiftdemo1 | shiftdemo2 | shiftdemo3
  ftl_igm_epochs: 300
  lr: 3.0e-3
  n_timestep_samples: 16
  warm_start: true
  device: cuda:0
