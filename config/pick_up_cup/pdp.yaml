# PDP (parameterized diffusion policy) training config -- PickUpCup
domain: pick_up_cup
state_dim: 22
action_dim: 8
horizon: 107

data:
  dir: data/pick_up_cup
  training: training.npz

encoder_checkpoint: results/pick_up_cup/encoder/best_model.pt

model:
  z_dim: 2
  mlp_dims: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024]
  time_dim: 16
  denoising_steps: 20
  ddim_steps: 8
  use_ddim: true
  film_at_layers: all

train:
  batch_size: 256
  num_epochs: 8000
  lr: 1.0e-4
  device: cuda:0
  save_dir: results/pick_up_cup/pdp
